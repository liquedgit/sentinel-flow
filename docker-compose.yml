services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - sentinel-flow

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sentinel-flow

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: sentinel-agent
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "9000:9000"
    environment:
      BACKEND_URL: http://host.docker.internal:8081
      LISTEN_ADDR: ":9000"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: sf-events-access
      ME_ENDPOINT: http://host.docker.internal:8081/me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sentinel-flow

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel_flow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/migration.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_flow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-flow

  detection-engine:
    build:
      context: ./detection-engine
      dockerfile: Dockerfile
    container_name: detection-engine
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel_flow
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_REQUEST_LOGS: sf-events-access
      KAFKA_TOPIC_SCAN_REQUESTS: scan-requests
      KAFKA_GROUP_ID: detection-engine
      LEARNING_WINDOW_DAYS: 90
      VIOLATION_THRESHOLD_PERCENT: 5
      MINIMUM_SAMPLE_SIZE: 100
    networks:
      - sentinel-flow
  dashboard:
    build:
      context: ./sentinel-flow-dashboard
      dockerfile: Dockerfile
    container_name: sentinel-flow-dashboard
    environment:
      - DATABASE_URL=postgresql://sentinel:sentinel@postgres:5432/sentinel_flow
      - SESSION_SECRET=s3nt1n3lfl0ws3cr3t!
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - web
      - sentinel-flow

networks:
  sentinel-flow:
    name: sentinel-flow-net
  web:
    external: true

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
